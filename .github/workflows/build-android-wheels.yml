name: Build Android Python Wheels

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        default: 'android-wheels-latest'
        type: string

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WHEELS_DIR: ${{ github.workspace }}/wheels
      JITER_WHEELS_DIR: ${{ github.workspace }}/wheels/jiter
      PYDANTIC_CORE_WHEELS_DIR: ${{ github.workspace }}/wheels/pydantic-core
      MOVIE_BOX_DL_WHEELS_DIR: ${{ github.workspace }}/wheels/movie-box-dl
      JITER_CACHE_KEY: android-wheels-jiter-Linux-0.14.0-cp313-v1
      PYDANTIC_CORE_CACHE_KEY: android-wheels-pydantic-core-Linux-2.33.2-jiter-0.14.0-cp313-v1
      MOVIE_BOX_DL_CACHE_KEY: android-wheels-movie-box-dl-Linux-2.0.2-cp313-v1

    steps:
      - name: Restore jiter wheels cache
        uses: actions/cache@v4
        id: jiter-cache
        with:
          path: ${{ env.JITER_WHEELS_DIR }}
          key: ${{ env.JITER_CACHE_KEY }}

      - name: Restore pydantic-core wheels cache
        uses: actions/cache@v4
        id: pydantic-core-cache
        with:
          path: ${{ env.PYDANTIC_CORE_WHEELS_DIR }}
          key: ${{ env.PYDANTIC_CORE_CACHE_KEY }}

      - name: Restore movie-box-dl wheel cache
        uses: actions/cache@v4
        id: movie-box-dl-cache
        with:
          path: ${{ env.MOVIE_BOX_DL_WHEELS_DIR }}
          key: ${{ env.MOVIE_BOX_DL_CACHE_KEY }}

      - name: Check cached jiter wheels completeness
        id: check-jiter
        run: |
          required=(
            "jiter-0.14.0-cp313-cp313-android_arm64_v8a.whl"
            "jiter-0.14.0-cp313-cp313-android_x86_64.whl"
          )
          all_present=true
          for whl in "${required[@]}"; do
            [ -f "${{ env.JITER_WHEELS_DIR }}/$whl" ] || all_present=false
          done
          echo "jiter_present=$all_present" >> "$GITHUB_OUTPUT"

      - name: Check cached pydantic-core wheels completeness
        id: check-pydantic-core
        run: |
          required=(
            "pydantic_core-2.33.2-cp313-cp313-android_arm64_v8a.whl"
            "pydantic_core-2.33.2-cp313-cp313-android_x86_64.whl"
          )
          all_present=true
          for whl in "${required[@]}"; do
            [ -f "${{ env.PYDANTIC_CORE_WHEELS_DIR }}/$whl" ] || all_present=false
          done
          echo "pydantic_core_present=$all_present" >> "$GITHUB_OUTPUT"

      - name: Check cached movie-box-dl wheel completeness
        id: check-movie-box-dl
        run: |
          whl_path="${{ env.MOVIE_BOX_DL_WHEELS_DIR }}/movie_box_dl-2.0.2-py3-none-any.whl"
          if [ -f "$whl_path" ]; then
            if unzip -t "$whl_path" >/dev/null 2>&1; then
              echo "movie_box_dl_present=true" >> "$GITHUB_OUTPUT"
            else
              echo "❌ Cached movie-box-dl wheel is corrupted, rebuilding..."
              rm -f "$whl_path"
              echo "movie_box_dl_present=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "movie_box_dl_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cibuildwheel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/cibuildwheel
          key: cibuildwheel-tooling-Linux-${{ env.JITER_CACHE_KEY }}-${{ env.PYDANTIC_CORE_CACHE_KEY }}

      - name: Checkout jiter source
        if: steps.check-jiter.outputs.jiter_present != 'true'
        uses: actions/checkout@v4
        with:
          repository: pydantic/jiter
          ref: v0.14.0
          path: jiter

      - name: Checkout pydantic-core source
        if: steps.check-pydantic-core.outputs.pydantic_core_present != 'true'
        uses: actions/checkout@v4
        with:
          repository: pydantic/pydantic-core
          ref: v2.33.2
          path: pydantic-core

      - name: Download movie-box-dl from PyPI (no source checkout needed)
        if: steps.check-movie-box-dl.outputs.movie_box_dl_present != 'true'
        run: |
          mkdir -p "${{ env.MOVIE_BOX_DL_WHEELS_DIR }}"
          pip download --only-binary=:all: --no-deps -d "${{ env.MOVIE_BOX_DL_WHEELS_DIR }}" movie-box-dl==2.0.2
          
          # Verify the downloaded wheel
          whl_path=$(ls -t ${{ env.MOVIE_BOX_DL_WHEELS_DIR }}/movie_box_dl*.whl | head -1)
          if [ -z "$whl_path" ] || ! unzip -t "$whl_path" >/dev/null 2>&1; then
            echo "❌ Downloaded movie-box-dl wheel is invalid or missing"
            exit 1
          fi
          
          echo "✅ movie-box-dl wheel downloaded and verified:"
          ls -la "$whl_path"

      - name: Set up Python 3.13
        if: steps.check-jiter.outputs.jiter_present != 'true' || steps.check-pydantic-core.outputs.pydantic_core_present != 'true' || steps.check-movie-box-dl.outputs.movie_box_dl_present != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        if: steps.check-jiter.outputs.jiter_present != 'true' || steps.check-pydantic-core.outputs.pydantic_core_present != 'true'
        run: pip install cibuildwheel

      - name: Build jiter for Android
        if: steps.check-jiter.outputs.jiter_present != 'true'
        working-directory: jiter/crates/jiter-python
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-android_arm64_v8a cp313-android_x86_64"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_TEST_SKIP: "*-android_*"
        run: |
          mkdir -p "${{ env.JITER_WHEELS_DIR }}"
          cibuildwheel --output-dir "${{ env.JITER_WHEELS_DIR }}"

      - name: Build pydantic-core for Android
        if: steps.check-pydantic-core.outputs.pydantic_core_present != 'true'
        working-directory: pydantic-core
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: "cp313-android_arm64_v8a cp313-android_x86_64"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_TEST_SKIP: "*-android_*"
          CIBW_BEFORE_BUILD: "pip install --no-index --find-links ${{ env.JITER_WHEELS_DIR }} jiter"
        run: |
          mkdir -p "${{ env.PYDANTIC_CORE_WHEELS_DIR }}"
          cibuildwheel --output-dir "${{ env.PYDANTIC_CORE_WHEELS_DIR }}"

      - name: Create or update wheels release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.inputs.release_tag }}
          name: ${{ inputs.release_tag || github.event.inputs.release_tag }}
          files: |
            ${{ env.JITER_WHEELS_DIR }}/*.whl
            ${{ env.PYDANTIC_CORE_WHEELS_DIR }}/*.whl
            ${{ env.MOVIE_BOX_DL_WHEELS_DIR }}/*.whl
          body: |
            Prebuilt Android wheels for pydantic-core, jiter, and movie-box-dl.
            **Python:** 3.13 | **ABIs:** arm64-v8a, x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}