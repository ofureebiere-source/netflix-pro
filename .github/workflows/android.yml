name: Android Release AAB

# Builds a signed *release* Android App Bundle (`.aab`) — the Play Store upload
# format — and publishes it to the rolling `android-latest` release as
# `netflix-pro-<version>.aab`, which is the asset name the in-app updater looks
# for (src/services/releases/releaseResolver.ts).
#
# Why a bundle and not an APK: Play requires an `.aab` and regenerates a split
# APK per device from it, which is smaller for the user and is the only format
# that supports Play's per-device optimisation. The trade-off is that a bundle
# cannot be sideloaded — it is not installable by itself — so the app's updater
# sends users to the release page rather than handing a file to a package
# installer.
#
# Signing: the bundle is signed with the release keystore. If the
# `ANDROID_KEYSTORE_BASE64` secret is absent, Gradle falls back to the debug
# keystore so a fork still builds; set the secret (plus
# ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD) for a
# production bundle.
#
# Play upload (optional): when `PLAY_SERVICE_ACCOUNT_JSON` is set, the bundle is
# also uploaded to the Play internal track. Without it the job stops after
# publishing the GitHub release.
#
# Zealot (first-party store): the same bundle is handed to Zealot on every push to
# main, so the store listing tracks the repository without a manual upload. Zealot's
# SDK does all the signing — the upload is direct, the bundle is never signed here
# for the store. The channel key is the duplicate guard: it needs no token and
# answers 404 when Zealot does not yet hold this exact version, so a re-run of an
# already-published version is a no-op instead of a failure.
#
# Repository variables: ZEALOT_URL, ZEALOT_CHANNEL_KEY, AUTO_RELEASE
# Repository secret:    ZEALOT_APP_TOKEN (a Zealot API token)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app/**'
      - 'assets/**'
      - 'android/**'
      - 'package.json'
      - 'app.config.ts'
      - 'App.tsx'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      fresh_build:
        description: 'Force a fresh build (clear Gradle and npm caches)'
        type: boolean
        default: false
      play_track:
        description: 'Play track to upload to when PLAY_SERVICE_ACCOUNT_JSON is set'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      name: ${{ steps.plan.outputs.name }}
      code: ${{ steps.plan.outputs.code }}
      bundle_id: ${{ steps.plan.outputs.bundle_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          ZEALOT_CHANNEL_KEY: ${{ vars.ZEALOT_CHANNEL_KEY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          name=$(node -p "require('./package.json').version")
          code=$(node -p "require('./package.json')['version-iteration']")
          # app.config.ts is TypeScript, so read the release package name directly.
          bundle_id=$(grep -m1 -oP "package:\s*IS_DEV\s*\?\s*\"[^\"]+\"\s*:\s*\"\K[^\"]+" app.config.ts || true)
          [ -n "$name" ] || fail "could not read version from package.json"
          [ -n "$code" ] || fail "could not read version-iteration from package.json"
          [ -n "$bundle_id" ] || fail "could not read the release package name from app.config.ts"

          # Upload only from main, and only when asked.
          publish=false
          note=""
          if [ "$REF" != "refs/heads/main" ]; then
            note="${REF#refs/heads/} is not main: nothing is uploaded"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$AUTO_RELEASE" = "true" ]; then
            publish=true
          else
            note="repository variable AUTO_RELEASE is not 'true': nothing is uploaded"
          fi

          # The channel key is the duplicate guard: it needs no token and answers 404
          # when Zealot does not yet hold this exact version.
          if [ "$publish" = "true" ]; then
            [ -n "${ZEALOT_URL:-}" ] || fail "repository variable ZEALOT_URL is not set"
            [ -n "${ZEALOT_CHANNEL_KEY:-}" ] || fail "repository variable ZEALOT_CHANNEL_KEY is not set"
            status=$(curl -sS -G -o "$RUNNER_TEMP/exist.json" -w '%{http_code}' \
              --max-time 120 --retry 3 --retry-delay 5 \
              --data-urlencode "channel_key=$ZEALOT_CHANNEL_KEY" \
              --data-urlencode "bundle_id=$bundle_id" \
              --data-urlencode "release_version=$name" \
              --data-urlencode "build_version=$code" \
              "${ZEALOT_URL%/}/api/apps/version_exist") || fail "could not reach Zealot"
            case "$status" in
              200) publish=false; note="Zealot already holds $name ($code)";;
              404) ;;
              *) head -c 800 "$RUNNER_TEMP/exist.json" || true; echo; fail "Zealot answered $status to version_exist";;
            esac
          fi

          {
            echo "publish=$publish"
            echo "name=$name"; echo "code=$code"; echo "bundle_id=$bundle_id"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::publish=$publish version=$name code=$code${note:+; $note}"

  build-release-aab:
    name: Build Release AAB
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Clear caches for a fresh build
        if: github.event.inputs.fresh_build == 'true'
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper node_modules .expo ~/.npm/_cacache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # JDK 17, not 21: expo-modules-core requests a Java 17 toolchain
      # (`kotlin.jvmToolchain(17)`). With only a newer JDK installed, Gradle tries
      # to provision 17 and the foojay resolver bundled with the React Native
      # Gradle plugin throws NoSuchFieldError on Gradle 9 — it references
      # JvmVendorSpec.IBM_SEMERU, which Gradle 9 removed.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Decode .env file
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" | base64 -d > .env
          else
            echo "No ENV_FILE secret set; building without a local .env."
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Android SDK components
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/ndk
          key: android-sdk-${{ runner.os }}-platform36-buildtools36.0.0-ndk27.1.12297006

      - name: Install SDK components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set NDK env vars
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Restore release keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "Using the configured release keystore."
          else
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the bundle will be signed with the debug key and is not suitable for distribution."
          fi

      - name: Generate debug keystore (fallback signing)
        if: steps.keystore.outputs.signed == 'false'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building netflix-pro-$VERSION.aab"

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          [ "${{ github.event.inputs.fresh_build }}" = 'true' ] && ./gradlew clean
          ./gradlew bundleRelease \
            --no-daemon --build-cache --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,x86_64
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename AAB to its release name
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SRC=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::No release bundle was produced."
            exit 1
          fi
          mkdir -p dist
          # Two names for the same bytes: the versioned one is what the in-app
          # updater matches on, and the unversioned alias is a stable target
          # that never 404s when the version is bumped, so the website's
          # fallback link stays valid even with the release API unreachable.
          OUT="dist/netflix-pro-${VERSION}.aab"
          cp "$SRC" "$OUT"
          cp "$SRC" "dist/netflix-pro.aab"
          ls -lh dist
          echo "aab=$OUT" >> $GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: netflix-pro-${{ steps.version.outputs.version }}-aab
          path: dist/*.aab
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Netflix Pro (Android)
          files: dist/*.aab
          make_latest: 'true'
          body: |
            Latest Android release build of Netflix Pro.

            **Version:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}
            **Signed:** ${{ steps.keystore.outputs.signed == 'true' && 'release keystore' || 'debug keystore (not for distribution)' }}

            This release contains `netflix-pro-${{ steps.version.outputs.version }}.aab`,
            an Android App Bundle. A bundle is the Play Store upload format and is
            **not installable directly** — Play generates a device-specific APK from
            it. Install or update through the Play Store listing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Zealot's SDK does all the signing, so the bundle is handed over as-is —
      # no keystore, no local signing. The upload opens a session, PUTs the bytes
      # to Zealot's staging bucket, finalizes, then waits for Zealot's CI to read,
      # sign and publish. The duplicate guard in `plan` has already established
      # that Zealot does not hold this exact version.
      - name: Hand the bundle to Zealot
        if: needs.plan.outputs.publish == 'true'
        env:
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          ZEALOT_CHANNEL_KEY: ${{ vars.ZEALOT_CHANNEL_KEY }}
          ZEALOT_APP_TOKEN: ${{ secrets.ZEALOT_APP_TOKEN }}
          AAB: ${{ steps.rename.outputs.aab }}
          NAME: ${{ needs.plan.outputs.name }}
          CODE: ${{ needs.plan.outputs.code }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "${ZEALOT_URL:-}" ] || fail "ZEALOT_URL is not set"
          [ -n "${ZEALOT_CHANNEL_KEY:-}" ] || fail "ZEALOT_CHANNEL_KEY is not set"
          [ -n "${ZEALOT_APP_TOKEN:-}" ] || fail "secret ZEALOT_APP_TOKEN is not set"
          base="${ZEALOT_URL%/}"
          echo "::add-mask::$ZEALOT_APP_TOKEN"
          size=$(stat -c %s "$AAB")
          changelog="Version $NAME (build $CODE), commit ${GITHUB_SHA:0:7}."

          status=$(curl -sS -o "$RUNNER_TEMP/session.json" -w '%{http_code}' --max-time 60 \
            --form-string "token=$ZEALOT_APP_TOKEN" \
            --form-string "channel_key=$ZEALOT_CHANNEL_KEY" \
            --form-string "filename=$(basename "$AAB")" \
            --form-string "size=$size" \
            --form-string "hold=false" \
            --form-string "source=github-actions" \
            --form-string "git_commit=$GITHUB_SHA" \
            --form-string "branch=$GITHUB_REF_NAME" \
            --form-string "ci_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --form-string "changelog=$changelog" \
            "$base/api/apps/upload_sessions") || fail "opening the upload session failed"
          [ "$status" = "201" ] || { head -c 1500 "$RUNNER_TEMP/session.json" || true; echo; fail "Zealot answered $status to the session (201 expected)"; }
          session_id=$(jq -er '.id | select(type == "number")' "$RUNNER_TEMP/session.json")
          upload_url=$(jq -er '.upload_url | select(type == "string" and startswith("https://"))' "$RUNNER_TEMP/session.json")
          echo "::add-mask::$upload_url"

          hdr_args=()
          while IFS= read -r line; do [ -n "$line" ] && hdr_args+=(-H "$line"); done \
            < <(jq -r '(.headers // {}) | to_entries[] | "\(.key): \(.value)"' "$RUNNER_TEMP/session.json")
          status=$(curl -sS -o "$RUNNER_TEMP/put.out" -w '%{http_code}' --max-time 1500 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            "${hdr_args[@]}" -X PUT --upload-file "$AAB" "$upload_url") || fail "the transfer to staging failed"
          case "$status" in 200|201|204) ;; *) head -c 800 "$RUNNER_TEMP/put.out" || true; echo; fail "staging answered $status";; esac

          status=$(curl -sS -o "$RUNNER_TEMP/finalize.json" -w '%{http_code}' --max-time 120 \
            -X POST --form-string "token=$ZEALOT_APP_TOKEN" \
            "$base/api/apps/upload_sessions/$session_id/finalize") || fail "finalize failed"
          [ "$status" = "200" ] || { head -c 1500 "$RUNNER_TEMP/finalize.json" || true; echo; fail "Zealot answered $status to finalize (200 expected)"; }

          deadline=$(( $(date +%s) + 1800 ))
          state=""
          while :; do
            status=$(curl -sS -o "$RUNNER_TEMP/poll.json" -w '%{http_code}' --max-time 60 \
              "$base/api/apps/upload_sessions/$session_id?token=$ZEALOT_APP_TOKEN") || status=000
            if [ "$status" = "200" ]; then
              state=$(jq -r '.state // ""' "$RUNNER_TEMP/poll.json")
              [ "$state" = "done" ] && break
              if [ "$state" = "failed" ] || [ "$state" = "expired" ]; then
                head -c 1500 "$RUNNER_TEMP/poll.json" || true; echo
                fail "Zealot ended the upload as $state"
              fi
            elif [ "$status" != "000" ] && [ "$status" != "429" ] && [ "${status:0:1}" != "5" ]; then
              head -c 800 "$RUNNER_TEMP/poll.json" || true; echo; fail "Zealot answered $status while waiting"
            fi
            [ "$(date +%s)" -lt "$deadline" ] || fail "Zealot had not finished after 30 minutes (last state: ${state:-unknown})"
            sleep 20
          done

          rel=$(jq -r '.release_version // "?"' "$RUNNER_TEMP/poll.json")
          echo "::notice::Zealot published $rel for $ZEALOT_CHANNEL_KEY"

      # `secrets` is not one of the contexts a step-level `if` may read, so the
      # presence of the credential is decided in a shell step and consumed as an
      # output. Writing `if: secrets.X != ''` silently evaluates to empty and the
      # upload never runs.
      - name: Check for Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set — skipping the Play upload."
          fi

      - name: Upload to Play Store
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.netflixpro.app
          releaseFiles: dist/netflix-pro-${{ steps.version.outputs.version }}.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed
