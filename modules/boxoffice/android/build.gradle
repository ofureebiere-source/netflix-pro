plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

apply from: '../nitrogen/generated/android/BoxOffice+autolinking.gradle'

group = 'expo.modules.boxoffice'
version = '1.0.0'

android {
    namespace "expo.modules.boxoffice"
    compileSdk 36
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdk 24
        targetSdk 36

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-O3 -fexceptions -frtti -std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            python.srcDir "src/main/python"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            options("--find-links", file("src/main/python/wheels").absolutePath)
            options("--only-binary", ":all:")
            install("pydantic-core==2.33.2")
            install("pydantic==2.11.7")
            install("movie-box-dl>=2.0.0")
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation project(':expo-modules-core')
    implementation project(':react-native-nitro-modules')
    implementation "com.facebook.react:react-android"
    implementation "com.facebook.fbjni:fbjni"
}